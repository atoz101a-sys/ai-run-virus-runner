<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>AI RUN : 바이러스 러너</title>
    <meta name="description" content="사이버 세계를 달리는 캐주얼 러닝 게임 — 삐야와 오르와 함께!" />
    <!-- Safari file:// 에서도 동작하도록 시스템 폰트 우선 사용 -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <!-- ① START 화면 -->
      <section id="screen-start" class="screen active">
        <nav class="main-tabs" role="tablist" aria-label="메인 메뉴">
          <button type="button" class="main-tab active" id="tab-home" role="tab" aria-selected="true" aria-controls="panel-home">GAME</button>
          <button type="button" class="main-tab" id="tab-settings" role="tab" aria-selected="false" aria-controls="panel-settings">설정</button>
        </nav>
        <div class="screen-inner tab-panel active" id="panel-home" role="tabpanel">
          <p class="eyebrow">바이브 코딩 실습</p>
          <h1 class="title-main">AI RUN</h1>
          <p class="subtitle">바이러스 러너</p>
          <p class="desc">
            바이러스가 가득한<br />
            사이버 세계를 달려라!
          </p>
          <div class="best-record" id="start-best">
            BEST — <span id="start-best-score">0</span> · <span id="start-best-distance">0</span>m
          </div>
          <button class="btn btn-primary" id="btn-start">GAME START</button>
        </div>
        <div class="screen-inner tab-panel" id="panel-settings" role="tabpanel" hidden></div>
        <div class="cyber-grid" aria-hidden="true"></div>
      </section>

      <!-- 설정 패널 (메인 탭 / 인게임 오버레이에서 공유) -->
      <div id="settings-panel" class="settings-panel" hidden>
        <section class="settings-group">
          <h3 class="settings-heading">사운드</h3>
          <label class="settings-row">
            <span>배경음악</span>
            <input type="checkbox" id="set-bgm-on" class="settings-toggle" checked />
          </label>
          <label class="settings-row">
            <span>BGM 볼륨</span>
            <input type="range" id="set-bgm-vol" class="settings-range" min="0" max="100" value="70" />
          </label>
          <label class="settings-row">
            <span>효과음</span>
            <input type="checkbox" id="set-sfx-on" class="settings-toggle" checked />
          </label>
          <label class="settings-row">
            <span>효과음 볼륨</span>
            <input type="range" id="set-sfx-vol" class="settings-range" min="0" max="100" value="80" />
          </label>
        </section>
        <section class="settings-group">
          <h3 class="settings-heading">키 조작</h3>
          <p class="settings-hint">버튼을 누른 뒤 원하는 키를 입력하세요. 기본 방향키일 때는 A / D도 함께 동작합니다.</p>
          <div class="settings-row">
            <span>왼쪽 이동</span>
            <button type="button" class="key-bind" data-action="left" id="bind-left">←</button>
          </div>
          <div class="settings-row">
            <span>오른쪽 이동</span>
            <button type="button" class="key-bind" data-action="right" id="bind-right">→</button>
          </div>
          <div class="settings-row">
            <span>일시정지 / 설정</span>
            <button type="button" class="key-bind" data-action="pause" id="bind-pause">Esc</button>
          </div>
          <button type="button" class="btn btn-ghost btn-compact" id="btn-reset-keys">기본 키로</button>
          <p class="settings-hint">모바일에서는 화면 왼쪽·오른쪽을 터치해 레인을 이동할 수 있습니다.</p>
        </section>
      </div>

      <!-- ② 캐릭터 선택 -->
      <section id="screen-select" class="screen">
        <div class="screen-inner">
          <h2 class="title-sub">SELECT YOUR AI</h2>
          <p class="desc">어떤 친구와 달릴까요?</p>
          <div class="char-grid">
            <button class="char-card selected" data-char="bbiya" id="char-bbiya">
              <div class="char-preview">
                <img src="assets/characters/bbiya/front.png" alt="삐야" />
              </div>
              <span class="char-name">🐥 삐야</span>
              <span class="char-meta">최대 체력 3 · 세로 피격 작음</span>
              <span class="char-badge">SELECTED</span>
            </button>
            <button class="char-card" data-char="oru" id="char-oru">
              <div class="char-preview">
                <img src="assets/characters/oru/front.png" alt="오르" />
              </div>
              <span class="char-name">🐻 오르</span>
              <span class="char-meta">최대 체력 5 · 세로 피격 넓음</span>
              <span class="char-badge">SELECTED</span>
            </button>
          </div>
          <button class="btn btn-primary" id="btn-play">▶ START</button>
          <button class="btn btn-ghost" id="btn-back-start">← 돌아가기</button>
        </div>
      </section>

      <!-- ③ 게임 화면 -->
      <section id="screen-game" class="screen">
        <div class="hud">
          <div class="hud-lives" id="hud-lives"></div>
          <div class="hud-stats">
            <span class="hud-score">SCORE <strong id="hud-score">00000</strong></span>
            <span class="hud-distance">DIST <strong id="hud-distance">0</strong>m</span>
          </div>
        </div>
        <canvas id="game-canvas"></canvas>
        <div class="touch-zones" id="touch-zones">
          <button class="touch-zone" data-dir="left" aria-label="왼쪽"></button>
          <button class="touch-zone" data-dir="center" aria-label="가운데"></button>
          <button class="touch-zone" data-dir="right" aria-label="오른쪽"></button>
        </div>
        <button class="btn-gear" id="btn-gear" aria-label="설정">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path
              fill="currentColor"
              d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.07 7.07 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.83 14.5a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.43.34.68.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.05.24.25.42.49.42h3.8c.24 0 .44-.18.49-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.25.12.54.02.68-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"
            />
          </svg>
        </button>
      </section>

      <!-- ④ 인게임 설정 (일시정지) -->
      <section id="screen-settings" class="screen overlay">
        <div class="screen-inner settings-overlay-inner">
          <h2 class="title-sub">설정</h2>
          <div id="settings-mount-game"></div>
          <button class="btn btn-primary" id="btn-settings-resume">계속하기</button>
          <button class="btn btn-ghost" id="btn-restart-settings">다시 시작</button>
          <button class="btn btn-ghost" id="btn-main-settings">메인으로</button>
        </div>
      </section>

      <!-- ⑤ GAME OVER -->
      <section id="screen-over" class="screen overlay">
        <div class="screen-inner">
          <h2 class="title-sub game-over-title">GAME OVER</h2>
          <div class="over-char" id="over-char-img"></div>
          <div class="over-stats">
            <div class="stat-row">
              <span>SCORE</span>
              <strong id="over-score">0</strong>
            </div>
            <div class="stat-row">
              <span>DISTANCE</span>
              <strong id="over-distance">0m</strong>
            </div>
            <div class="stat-row best">
              <span>BEST</span>
              <strong id="over-best">0</strong>
            </div>
          </div>
          <button class="btn btn-primary" id="btn-retry">다시 플레이</button>
          <button class="btn btn-ghost" id="btn-main-over">메인으로</button>
        </div>
      </section>

      <!-- 피드백 토스트 -->
      <div id="toast" class="toast" aria-live="polite"></div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
